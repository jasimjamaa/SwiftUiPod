name: iOS

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      export_method:
        description: Unsigned needs no certificate; signed methods require a matching profile
        type: choice
        default: unsigned
        options:
          - unsigned
          - release-testing
          - app-store-connect
          - debugging

permissions:
  contents: read

concurrency:
  group: ios-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

env:
  PROJECT: applications/iOS/notes/Notes.xcodeproj
  SCHEME: Notes
  BUNDLE_ID: ${{ vars.IOS_BUNDLE_ID || 'com.swiftuipod.neonotes.Notes' }}

jobs:
  build:
    name: Build unsigned IPA
    if: github.event_name == 'pull_request' || (inputs.export_method || vars.IOS_EXPORT_METHOD || 'unsigned') == 'unsigned'
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: xcodebuild -version
      - name: Validate signing configuration logic
        run: python3 -m unittest discover -s scripts/ci -p 'test_*.py'
      - name: Archive without signing
        run: |
          xcodebuild -project "$PROJECT" -scheme "$SCHEME" \
            -configuration Release -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            -archivePath "$RUNNER_TEMP/Notes.xcarchive" \
            PRODUCT_BUNDLE_IDENTIFIER="$BUNDLE_ID" \
            CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER.$GITHUB_RUN_ATTEMPT" \
            CODE_SIGNING_ALLOWED=NO archive
      - name: Package unsigned IPA
        run: |
          app="$RUNNER_TEMP/Notes.xcarchive/Products/Applications/Notes.app"
          test -f "$app/Info.plist"
          mkdir -p "$RUNNER_TEMP/unsigned-ipa/Payload"
          ditto "$app" "$RUNNER_TEMP/unsigned-ipa/Payload/Notes.app"
          ditto -c -k --keepParent "$RUNNER_TEMP/unsigned-ipa/Payload" \
            "$RUNNER_TEMP/Notes-unsigned.ipa"
          echo 'Unsigned IPA: requires signing before installation on an iPhone.' >> "$GITHUB_STEP_SUMMARY"
      - name: Upload unsigned IPA
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Notes-unsigned-${{ github.run_number }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/Notes-unsigned.ipa
          if-no-files-found: error
          retention-days: 14

  signed-ipa:
    name: Export signed IPA
    if: github.event_name != 'pull_request' && (inputs.export_method || vars.IOS_EXPORT_METHOD || 'unsigned') != 'unsigned'
    runs-on: macos-26
    timeout-minutes: 30
    env:
      EXPORT_METHOD: ${{ inputs.export_method || vars.IOS_EXPORT_METHOD || 'unsigned' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: xcodebuild -version
      - name: Validate signing configuration logic
        run: python3 -m unittest discover -s scripts/ci -p 'test_*.py'
      - name: Install signing certificate and provisioning profile
        env:
          KEYCHAIN_PATH: ${{ runner.temp }}/ios-signing.keychain-db
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
        run: |
          for name in BUILD_CERTIFICATE_BASE64 P12_PASSWORD BUILD_PROVISION_PROFILE_BASE64; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Missing repository secret: $name. See README.md signing setup."
              exit 1
            fi
          done
          umask 077
          printf '%s' "$BUILD_CERTIFICATE_BASE64" | base64 --decode > "$RUNNER_TEMP/signing.p12"
          printf '%s' "$BUILD_PROVISION_PROFILE_BASE64" | base64 --decode > "$RUNNER_TEMP/signing.mobileprovision"
          keychain_password="$(openssl rand -hex 32)"
          echo "::add-mask::$keychain_password"
          security create-keychain -p "$keychain_password" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 3600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$keychain_password" "$KEYCHAIN_PATH"
          security import "$RUNNER_TEMP/signing.p12" -P "$P12_PASSWORD" \
            -t cert -f pkcs12 -k "$KEYCHAIN_PATH" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -k "$keychain_password" "$KEYCHAIN_PATH" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN_PATH"
          python3 scripts/ci/prepare_signing.py
          rm -f "$RUNNER_TEMP/signing.p12"

      - name: Archive and export
        run: |
          xcodebuild -project "$PROJECT" -scheme "$SCHEME" \
            -configuration Release -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            -archivePath "$RUNNER_TEMP/Notes.xcarchive" \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            PRODUCT_BUNDLE_IDENTIFIER="$BUNDLE_ID" \
            CODE_SIGN_IDENTITY="$SIGNING_IDENTITY" \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_UUID" \
            CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER.$GITHUB_RUN_ATTEMPT" \
            archive
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Notes.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/ipa"

      - name: Verify exported signature
        run: |
          shopt -s nullglob
          ipas=("$RUNNER_TEMP/ipa/"*.ipa)
          if [[ ${#ipas[@]} -ne 1 ]]; then
            echo '::error::Expected exactly one exported IPA.'
            exit 1
          fi
          ditto -x -k "${ipas[0]}" "$RUNNER_TEMP/verify-ipa"
          apps=("$RUNNER_TEMP/verify-ipa/Payload/"*.app)
          [[ ${#apps[@]} -eq 1 ]]
          test -f "${apps[0]}/embedded.mobileprovision"
          codesign --verify --deep --strict --verbose=2 "${apps[0]}"

      - name: Upload signed IPA
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Notes-${{ env.EXPORT_METHOD }}-${{ github.run_number }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ipa/*.ipa
          if-no-files-found: error
          retention-days: 14

      - name: Clean up signing material
        if: always()
        env:
          KEYCHAIN_PATH: ${{ runner.temp }}/ios-signing.keychain-db
        run: |
          if [[ -f "$KEYCHAIN_PATH" ]]; then
            security delete-keychain "$KEYCHAIN_PATH"
          fi
          rm -f "$RUNNER_TEMP/signing.p12" "$RUNNER_TEMP/signing.mobileprovision" \
            "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles/SwiftUiPod-CI.mobileprovision"
          rm -rf "$RUNNER_TEMP/verify-ipa"
